[project]
name = "svc_platform"
version = "0.94.0"
description = "Платформа для запуска сервисов, `svc_` стандарт (репозитории Mike2024New которые содержат `svc_`"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "infrastructure2",
    "websockets>=16.1.1",
    "aiohttp>=3.14.3",
]


# ссылка на infrastructure2
[tool.uv.sources.infrastructure2]
git = "ssh://git@github.com/mike2024new/infrastructure2.git"
subdirectory = "."
rev = "46abd832a3c3d6579d24ba99acab6d4e910ba162"


[build-system]
requires = [
    "setuptools",
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = [
    "svc_platform*",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
asyncio_mode = "auto"
pythonpath = [
    ".",
]


[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
]
