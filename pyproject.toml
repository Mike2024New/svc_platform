[project]
name = "svc_platform"
version = "0.36.0"
description = "Платформа для запуска сервисов, `svc_` стандарт (репозитории Mike2024New которые содержат `svc_`"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "infrastructure-server",
    "infrastructure-cli-utils",
    "infrastructure-message-bus",
    "infrastructure-path-utils",
    "infrastructure-http-clients",
    "infrastructure-process-utils",
    "websockets>=16.1.1",
]

[build-system]
requires = [
    "setuptools",
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = [
    "svc_platform*",
]

[tool.uv.sources]
infrastructure-server = { git = "https://github.com/mike2024new/infrastructure2.git", subdirectory = "packages/infrastructure_server", rev = "5635f3be2b6c90289ee513fc944fefff57d7bd1b" }
infrastructure-cli-utils = { git = "https://github.com/mike2024new/infrastructure2.git", subdirectory = "packages/infrastructure_cli_utils", rev = "5635f3be2b6c90289ee513fc944fefff57d7bd1b" }
infrastructure-message-bus = { git = "https://github.com/mike2024new/infrastructure2.git", subdirectory = "packages/infrastructure_message_bus", rev = "5635f3be2b6c90289ee513fc944fefff57d7bd1b" }
infrastructure-path-utils = { git = "https://github.com/mike2024new/infrastructure2.git", subdirectory = "packages/infrastructure_path_utils", rev = "5635f3be2b6c90289ee513fc944fefff57d7bd1b" }
infrastructure-http-clients = { git = "https://github.com/mike2024new/infrastructure2.git", subdirectory = "packages/infrastructure_http_clients", rev = "5635f3be2b6c90289ee513fc944fefff57d7bd1b" }
infrastructure-process-utils = { git = "https://github.com/mike2024new/infrastructure2.git", subdirectory = "packages/infrastructure_process_utils", rev = "5635f3be2b6c90289ee513fc944fefff57d7bd1b" }

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
asyncio_mode = "auto"
pythonpath = [
    ".",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
]
