[project]
name = "svc_platform"
version = "0.72.0"
description = "Платформа для запуска сервисов, `svc_` стандарт (репозитории Mike2024New которые содержат `svc_`"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "infrastructure2",
    "websockets>=16.1.1",
    "aiohttp>=3.14.3",
]

[build-system]
requires = [
    "setuptools",
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = [
    "svc_platform*",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
asyncio_mode = "auto"
pythonpath = [
    ".",
]

[tool.uv.sources.infrastructure2]
git = "https://github.com/mike2024new/infrastructure2.git"
subdirectory = "."
rev = "9c95a199bd1188e115bf17208d4ec8beada8f579"

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
]
